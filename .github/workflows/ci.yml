
name: Aula 03 - Integracao Continua

on:
  push:
  pull_request:

jobs:
  testar-site:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar arquivo HTML
        run: test -f index.html

      - name: Verificar estrutura HTML
        run: grep -qi "<html" index.html

      - name: Verificar titulo da pagina
        run: grep -qi "<title" index.html

      - name: Finalizar testes
        run: echo "Todos os testes passaram!"
